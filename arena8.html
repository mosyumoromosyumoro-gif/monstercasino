<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1416">
<title>闘技場 計測ノート</title>
<style>
  :root{
    --ink:#0B1416;
    --panel:#12211F;
    --panel2:#182D2A;
    --line:#24403C;
    --paper:#E8EDE9;
    --muted:#6F8580;
    --signal:#F2B441;
    --warn:#E2564A;
    --cool:#4E9AA8;
    --ok:#5FBF8F;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--ink); color:var(--paper);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    font-size:15px; line-height:1.5;
    padding:0 0 90px; max-width:560px; margin:0 auto;
  }
  .num{font-family:"SF Mono","Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

  header{
    padding:18px 16px 12px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  }
  header h1{font-size:15px;font-weight:700;letter-spacing:.14em}
  header .phase{font-size:11px;color:var(--muted);letter-spacing:.08em}

  nav{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink);z-index:10}
  nav button{
    flex:1;background:none;border:none;color:var(--muted);
    padding:13px 4px;font-size:13px;font-family:inherit;letter-spacing:.06em;
    border-bottom:2px solid transparent;cursor:pointer;
  }
  nav button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--signal)}

  .view{padding:16px;display:none}
  .view.on{display:block}

  .eyebrow{font-size:11px;color:var(--muted);letter-spacing:.16em;margin:22px 0 8px}
  .eyebrow:first-child{margin-top:0}

  .row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  input,select{
    background:var(--panel);border:1px solid var(--line);color:var(--paper);
    border-radius:6px;padding:11px 10px;font-size:16px;font-family:inherit;width:100%;
  }
  input:focus,select:focus{outline:2px solid var(--cool);outline-offset:-1px}
  input.odds{flex:0 0 88px;text-align:right}
  .row .del{
    flex:0 0 34px;background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:6px;height:42px;font-size:18px;cursor:pointer;
  }

  button.act{
    width:100%;padding:14px;border-radius:6px;border:none;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.08em;
    background:var(--paper);color:var(--ink);margin-top:6px;
  }
  button.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-weight:400}

  /* --- 判定結果 --- */
  .verdict{
    margin:18px 0 4px;padding:16px;border-radius:8px;
    background:var(--panel);border:1px solid var(--line);
  }
  .verdict.bet{border-color:var(--signal);background:#1C1B10}
  .verdict .label{font-size:11px;letter-spacing:.16em;color:var(--muted)}
  .verdict .target{font-size:20px;font-weight:700;margin:4px 0 2px}
  .verdict .amount{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .verdict.bet .amount{color:var(--signal)}
  .verdict .why{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.6}

  .card{
    border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;
    background:var(--panel);
  }
  .card.pick{border-color:var(--signal)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card .nm{font-size:15px;font-weight:700}
  .card .ev{font-size:17px;font-weight:700}
  .card .sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}

  /* 署名要素: 乖離ゲージ */
  .gauge{position:relative;height:26px;margin-top:10px}
  .gauge .track{position:absolute;top:12px;left:0;right:0;height:2px;background:var(--line)}
  .gauge .mean{position:absolute;top:5px;width:1px;height:16px;background:var(--muted)}
  .gauge .now{position:absolute;top:2px;width:3px;height:22px;background:var(--cool);border-radius:2px}
  .gauge .now.rich{background:var(--signal)}
  .gauge .cap{position:absolute;top:0;font-size:10px;color:var(--muted)}
  .gauge .cap.l{left:0}.gauge .cap.r{right:0}
  .nogauge{font-size:11.5px;color:var(--muted);margin-top:8px}

  .winrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .winrow button{
    flex:1 1 30%;padding:12px 6px;border-radius:6px;border:1px solid var(--line);
    background:var(--panel2);color:var(--paper);font-family:inherit;font-size:13px;cursor:pointer;
  }
  .winrow button.draw{color:var(--cool)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:400;font-size:11px;letter-spacing:.06em}

  .stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .stat b{font-weight:700}
  .good{color:var(--ok)}.bad{color:var(--warn)}.warnc{color:var(--signal)}

  .note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px}
  textarea{
    width:100%;height:120px;background:var(--panel);border:1px solid var(--line);
    color:var(--paper);border-radius:6px;padding:10px;font-size:12px;font-family:monospace;
  }
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--paper);color:var(--ink);padding:11px 18px;border-radius:6px;
    font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;
  }
  .toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>闘技場 計測ノート</h1>
  <span class="phase num" id="phase">—</span>
</header>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-v="bet">判定</button>
  <button role="tab" aria-selected="false" data-v="log">記録</button>
  <button role="tab" aria-selected="false" data-v="check">検証</button>
  <button role="tab" aria-selected="false" data-v="data">設定</button>
</nav>

<!-- ============ 判定 ============ -->
<section class="view on" id="v-bet">
  <div class="eyebrow">出走者と倍率</div>
  <div id="entrants"></div>
  <datalist id="names"></datalist>
  <div class="row">
    <button class="act ghost" id="addRow" style="margin:0">出走者を追加</button>
    <button class="act ghost" id="clearRow" style="margin:0">消す</button>
  </div>
  <button class="act" id="judge">判定する</button>

  <div id="result"></div>

  <div class="eyebrow" id="recentLabel" style="display:none">最近のパターン</div>
  <div id="recent"></div>
</section>

<!-- ============ 記録 ============ -->
<section class="view" id="v-log">
  <div id="logStats"></div>
  <div class="eyebrow">直近の試合</div>
  <div id="logList"></div>
</section>

<!-- ============ 検証 ============ -->
<section class="view" id="v-check">
  <div id="checkBody"></div>
</section>

<!-- ============ 設定 ============ -->
<section class="view" id="v-data">
  <div class="eyebrow">所持金</div>
  <input class="num" id="bank" type="number" inputmode="numeric">
  <div class="note">ケリー基準の計算に使います。実際の所持金を入れてください。</div>

  <div class="eyebrow">賭ける条件</div>
  <div class="row">
    <span style="flex:1;font-size:13.5px">EVがこの値を超えたら勝負</span>
    <input class="num odds" id="thresh" type="number" step="0.01">
  </div>
  <div class="row">
    <span style="flex:1;font-size:13.5px">ケリーの何分の1を使うか</span>
    <input class="num odds" id="kfrac" type="number" step="0.05">
  </div>
  <div class="note">
    初期値はEV 1.15・1/4ケリー。控除率が約8.3%なので、EV 1.0付近で賭けると必ず負けます。
    推定誤差がある以上、満額ケリーは最適点ではなく破産点寄りです。
  </div>

  <div class="eyebrow">バックアップ</div>
  <textarea id="io" placeholder="ここに貼り付けて取り込み"></textarea>
  <div class="row" style="margin-top:8px">
    <button class="act ghost" id="exp" style="margin:0">書き出す</button>
    <button class="act ghost" id="imp" style="margin:0">取り込む</button>
  </div>
  <div class="note">古いアプリの書き出し（extra / matchups を含む形式）もそのまま取り込めます。ログだけを読み、集計は毎回作り直します。</div>

  <div class="eyebrow">全消去</div>
  <button class="act ghost" id="wipe" style="color:var(--warn);border-color:var(--warn)">記録を全部消す</button>
</section>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ---------- 保存層: window.storage → localStorage → メモリ ---------- */
const Vault = (() => {
  const KEY = "arena8";
  let mem = null;
  const hasWS = typeof window !== "undefined" && window.storage && window.storage.get;
  return {
    async load(){
      try{
        if(hasWS){ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
        const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null;
      }catch(e){ return mem; }
    },
    async save(obj){
      mem = obj;
      try{
        if(hasWS){ await window.storage.set(KEY, JSON.stringify(obj)); return; }
        localStorage.setItem(KEY, JSON.stringify(obj));
      }catch(e){}
    }
  };
})();

/* ---------- 状態: ログだけが真実。統計は毎回ここから作る ---------- */
let S = { log:[], bank:1000, thresh:1.15, kfrac:0.25 };

const KEY_OF = names => [...names].sort().join("|");
const DRAW = "__draw__";
const SHRINK_K = 40;   // 勝率を倍率が示す値へ縮小する擬似観測数
const DRAW_K   = 10;   // 引き分け率の縮小
const ODDS_MIN = 5;    // このパターンで何戦たまったら平均倍率を基準に使うか
const BET_MIN = 1, BET_MAX = 100;

function save(){ Vault.save(S); }

/* ---------- パターン統計 ---------- */
function patternsIndex(){
  const m = new Map();
  for(const e of S.log){
    const k = KEY_OF(e.names);
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(e);
  }
  return m;
}
function globalDrawRate(){
  if(!S.log.length) return 0.07;
  return S.log.filter(e => e.winner === DRAW).length / S.log.length;
}
function allNames(){
  const s = new Set();
  S.log.forEach(e => e.names.forEach(n => s.add(n)));
  return [...s].sort();
}

/* ---------- 中核: 1試合の評価 ---------- */
function evaluate(entrants){
  const names = entrants.map(e => e.name);
  const odds  = entrants.map(e => e.odds);
  const invNow = odds.map(o => 1/o);
  const sNow = invNow.reduce((a,b)=>a+b,0);
  const qNow = invNow.map(v => v/sNow);          // 今の倍率が示す条件付き勝率
  const takeout = 1 - 1/sNow;

  const past = patternsIndex().get(KEY_OF(names)) || [];
  const dec  = past.filter(e => e.winner !== DRAW);
  const nPat = past.length;

  // 基準確率: パターンの平均倍率が使えるならそちら。使えなければ今の倍率。
  let base = qNow, meanOdds = null, usingMean = false;
  if(nPat >= ODDS_MIN){
    meanOdds = names.map(n => {
      const arr = past.map(e => e.odds[n]).filter(v => typeof v === "number" && v > 0);
      return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
    });
    if(meanOdds.every(v => v !== null)){
      const inv = meanOdds.map(o => 1/o);
      const s = inv.reduce((a,b)=>a+b,0);
      base = inv.map(v => v/s);
      usingMean = true;
    }
  }

  // 勝率: パターン内実績を base へ縮小
  const wins = names.map(n => dec.filter(e => e.winner === n).length);
  const p = names.map((n,i) => (wins[i] + SHRINK_K*base[i]) / (dec.length + SHRINK_K));

  // 引き分け率も全体率へ縮小
  const g = globalDrawRate();
  const pDraw = (past.filter(e=>e.winner===DRAW).length + DRAW_K*g) / (nPat + DRAW_K);

  const rows = names.map((n,i) => {
    const o = odds[i];
    const ev = pDraw + (1-pDraw) * p[i] * o;      // 引き分けは返金
    const P = (1-pDraw) * p[i];                    // 無条件の勝率
    const L = 1 - P - pDraw;
    const kelly = (o > 1) ? (P*(o-1) - L) / ((o-1)*(1-pDraw)) : 0;
    const rawSize = Math.round(S.kfrac * kelly * S.bank);
    // 過去のこの個体の倍率レンジ
    const hist = past.map(e => e.odds[n]).filter(v => typeof v === "number" && v > 0);
    return {
      name:n, odds:o, q:qNow[i], base:base[i], p:p[i], ev, kelly, rawSize,
      hist, mean: hist.length ? hist.reduce((a,b)=>a+b,0)/hist.length : null,
      wins:wins[i]
    };
  });

  const best = rows.reduce((a,b) => b.ev > a.ev ? b : a, rows[0]);
  const go = best.ev > S.thresh && best.rawSize >= BET_MIN;
  const size = go ? Math.max(BET_MIN, Math.min(BET_MAX, best.rawSize)) : BET_MIN;
  // 見送りは最低額を最低倍率に置く（分散を最小にして待つ）
  const parkIdx = odds.indexOf(Math.min(...odds));
  const pick = go ? best : rows[parkIdx];
  const capped = go && best.rawSize > BET_MAX;

  return { rows, pick, size, go, capped, nPat, dec:dec.length, pDraw, takeout, usingMean, meanOdds };
}

/* ---------- 判定画面 ---------- */
function entrantRows(){ return [...$("entrants").querySelectorAll(".row")]; }

function addRow(name="", odds=""){
  if(entrantRows().length >= 4) return;
  const d = document.createElement("div");
  d.className = "row";
  d.innerHTML = `<input list="names" placeholder="モンスター名" value="${name}">
    <input class="odds num" type="number" step="0.1" inputmode="decimal" placeholder="倍率" value="${odds}">
    <button class="del" aria-label="この行を消す">×</button>`;
  d.querySelector(".del").onclick = () => { if(entrantRows().length > 2) d.remove(); };
  $("entrants").appendChild(d);
}
function readEntrants(){
  const out = [];
  for(const r of entrantRows()){
    const [a,b] = r.querySelectorAll("input");
    const nm = a.value.trim(), od = parseFloat(b.value);
    if(nm && !isNaN(od) && od > 0) out.push({name:nm, odds:od});
  }
  return out;
}

let pending = null;

function renderResult(){
  const box = $("result");
  const ent = readEntrants();
  if(ent.length < 2){ box.innerHTML = `<div class="note">出走者を2体以上、倍率つきで入れてください。</div>`; return; }
  const names = ent.map(e=>e.name);
  if(new Set(names).size !== names.length){ box.innerHTML = `<div class="note">同じ名前が2つあります。</div>`; return; }

  const R = evaluate(ent);
  pending = { ent, R };

  const why = R.go
    ? `EV ${R.pick.ev.toFixed(2)}。しきい値 ${S.thresh} を超えたので勝負。${R.capped ? "<span class='warnc'>※ケリーは上限100を超える額を要求しています。勝率を過大推定している可能性。</span>" : ""}`
    : `EV が ${S.thresh} に届かないので最低額で待機。倍率の取り分は約 ${(R.takeout*100).toFixed(1)}%、これを超える優位が見えるまで賭け金は伸ばしません。`;

  let html = `
    <div class="verdict ${R.go ? "bet" : ""}">
      <div class="label">${R.go ? "勝負" : "待機"}</div>
      <div class="target">${R.pick.name} <span class="num" style="color:var(--muted);font-size:14px">${R.pick.odds.toFixed(2)}倍</span></div>
      <div class="amount num">${R.size}</div>
      <div class="why">${why}</div>
    </div>
    <div class="eyebrow">内訳</div>`;

  for(const r of R.rows){
    const isPick = r.name === R.pick.name;
    html += `<div class="card ${isPick && R.go ? "pick" : ""}">
      <div class="top">
        <span class="nm">${r.name}</span>
        <span class="ev num" style="color:${r.ev > S.thresh ? "var(--signal)" : r.ev < 1 ? "var(--muted)" : "var(--paper)"}">EV ${r.ev.toFixed(2)}</span>
      </div>
      <div class="sub num">
        <span>倍率 ${r.odds.toFixed(2)}</span>
        <span>推定勝率 ${(r.p*100).toFixed(0)}%</span>
        <span>倍率が示す ${(r.q*100).toFixed(0)}%</span>
        <span>実績 ${r.wins}/${R.dec}</span>
      </div>
      ${gaugeHTML(r)}
    </div>`;
  }

  html += `<div class="note">
    このパターンは <b class="num">${R.nPat}</b> 戦ぶん記録済み${R.usingMean ? "。平均倍率を基準にしています" : `。あと ${Math.max(0, ODDS_MIN - R.nPat)} 戦で平均倍率が使えます`}。
    引き分け率 ${(R.pDraw*100).toFixed(0)}%。
  </div>`;

  html += `<div class="eyebrow">結果を記録</div><div class="winrow">`;
  for(const r of R.rows) html += `<button data-w="${r.name}">${r.name}</button>`;
  html += `<button class="draw" data-w="${DRAW}">引き分け</button></div>`;

  box.innerHTML = html;
  box.querySelectorAll(".winrow button").forEach(b => b.onclick = () => record(b.dataset.w));
}

/* 署名要素: そのパターンでこの倍率が高いか安いかを示す計器 */
function gaugeHTML(r){
  if(r.hist.length < 3) return `<div class="nogauge">倍率の履歴 ${r.hist.length} 戦 — レンジを出すにはあと ${3-r.hist.length} 戦</div>`;
  const lo = Math.min(...r.hist, r.odds), hi = Math.max(...r.hist, r.odds);
  const span = (hi - lo) || 1;
  const pos = v => ((v - lo)/span)*100;
  const dev = r.odds / r.mean;
  const rich = dev >= 1.05;
  return `<div class="gauge">
      <div class="track"></div>
      <div class="mean" style="left:${pos(r.mean)}%"></div>
      <div class="now ${rich?"rich":""}" style="left:calc(${pos(r.odds)}% - 1px)"></div>
      <div class="cap l num">${lo.toFixed(1)}</div>
      <div class="cap r num">${hi.toFixed(1)}</div>
    </div>
    <div class="sub num" style="margin-top:-4px">
      <span>平均 ${r.mean.toFixed(2)}倍</span>
      <span style="color:${rich?"var(--signal)":dev<=0.95?"var(--warn)":"var(--muted)"}">
        ${dev>=1 ? "+" : ""}${((dev-1)*100).toFixed(0)}% ${rich ? "割高" : dev<=0.95 ? "割安" : "平常"}
      </span>
    </div>`;
}

function record(winner){
  if(!pending) return;
  const { ent, R } = pending;
  const odds = {};
  ent.forEach(e => odds[e.name] = e.odds);
  S.log.push({
    names: ent.map(e=>e.name), odds, winner,
    bet: { name:R.pick.name, amount:R.size, ev:R.pick.ev, go:R.go },
    ts: Date.now()
  });
  // 収支を所持金へ反映
  const b = R.size;
  let delta = -b;
  if(winner === DRAW) delta += b;
  else if(winner === R.pick.name) delta += b * R.pick.odds;
  S.bank = Math.max(1, Math.round(S.bank + delta));
  $("bank").value = S.bank;
  save();
  toast(delta >= 0 ? `+${delta}　所持金 ${S.bank}` : `${delta}　所持金 ${S.bank}`);
  pending = null;
  renderResult();   // 同じ組み合わせが続くことが多いので入力は残す
  renderRecent(); renderPhase();
}

/* ---------- 最近のパターン ---------- */
function renderRecent(){
  const seen = [], out = [];
  for(let i = S.log.length-1; i >= 0 && out.length < 6; i--){
    const k = KEY_OF(S.log[i].names);
    if(seen.includes(k)) continue;
    seen.push(k); out.push(S.log[i]);
  }
  $("recentLabel").style.display = out.length ? "block" : "none";
  $("recent").innerHTML = out.map((e,i) =>
    `<button class="act ghost" data-i="${i}" style="text-align:left;margin-top:6px;font-size:13px">${e.names.join(" / ")}</button>`
  ).join("");
  $("recent").querySelectorAll("button").forEach(b => b.onclick = () => {
    const e = out[+b.dataset.i];
    $("entrants").innerHTML = "";
    e.names.forEach(n => addRow(n, ""));
    window.scrollTo({top:0, behavior:"smooth"});
  });
}

/* ---------- 記録タブ ---------- */
function renderLog(){
  const bets = S.log.filter(e => e.bet);
  let stake = 0, ret = 0, hit = 0;
  for(const e of bets){
    stake += e.bet.amount;
    if(e.winner === DRAW) ret += e.bet.amount;
    else if(e.winner === e.bet.name){ ret += e.bet.amount * e.odds[e.bet.name]; hit++; }
  }
  const roi = stake ? ret/stake : 0;
  $("logStats").innerHTML = `
    <div class="stat"><span>記録した試合</span><b class="num">${S.log.length}</b></div>
    <div class="stat"><span>賭けた総額</span><b class="num">${stake}</b></div>
    <div class="stat"><span>回収率</span><b class="num ${roi>=1?"good":roi>=0.917?"warnc":"bad"}">${stake?(roi*100).toFixed(0)+"%":"—"}</b></div>
    <div class="stat"><span>収支</span><b class="num ${ret-stake>=0?"good":"bad"}">${stake?(ret-stake>=0?"+":"")+(ret-stake).toFixed(0):"—"}</b></div>
    <div class="stat"><span>的中</span><b class="num">${hit} / ${bets.length}</b></div>`;

  $("logList").innerHTML = S.log.slice(-40).reverse().map((e,idx) => {
    const i = S.log.length - 1 - idx;
    const w = e.winner === DRAW ? "引き分け" : e.winner;
    const on = e.bet ? `${e.bet.name} に ${e.bet.amount}` : "記録のみ";
    const hitc = e.bet && (e.winner === e.bet.name || e.winner === DRAW);
    return `<div class="card"><div class="top">
        <span class="nm" style="font-size:13.5px">${e.names.join(" / ")}</span>
        <span class="num" style="font-size:12px;color:${hitc?"var(--ok)":"var(--muted)"}">${w}</span>
      </div>
      <div class="sub num"><span>${e.names.map(n=>e.odds[n].toFixed(1)).join(" · ")}</span><span>${on}</span>
      <span><button class="del" data-i="${i}" style="height:22px;width:28px;flex:none;font-size:13px">×</button></span></div></div>`;
  }).join("") || `<div class="note">まだ記録がありません。判定タブで1試合入れると、ここから統計が育ちはじめます。</div>`;

  $("logList").querySelectorAll("button.del").forEach(b => b.onclick = () => {
    S.log.splice(+b.dataset.i, 1); save(); renderLog(); renderPhase(); renderRecent();
  });
}

/* ---------- 検証タブ ---------- */
function renderCheck(){
  const P = patternsIndex();
  const counts = [...P.values()].map(v => v.length);
  const ready = counts.filter(c => c >= ODDS_MIN).length;
  const solid = counts.filter(c => c >= 20).length;

  // 倍率帯ごとの回収率（全出走者に1ずつ賭けた仮想）
  const BANDS = [[1,1.5],[1.5,2],[2,3],[3,5],[5,10],[10,50],[50,Infinity]];
  const band = BANDS.map(() => ({n:0, ret:0, w:0}));
  for(const e of S.log){
    for(const n of e.names){
      const o = e.odds[n];
      const bi = BANDS.findIndex(b => o >= b[0] && o < b[1]);
      if(bi < 0) continue;
      band[bi].n++;
      if(e.winner === DRAW) band[bi].ret += 1;
      else if(e.winner === n){ band[bi].ret += o; band[bi].w++; }
    }
  }

  // 乖離テスト: 平均より高い倍率で買ったときと安いときで、回収率が違うか
  const hist = new Map();  // key|name -> odds[]
  let hi = {n:0,ret:0,w:0}, lo = {n:0,ret:0,w:0};
  for(const e of S.log){
    const k = KEY_OF(e.names);
    for(const n of e.names){
      const kk = k+"@"+n, arr = hist.get(kk) || [];
      if(arr.length >= 3){
        const m = arr.reduce((a,b)=>a+b,0)/arr.length, o = e.odds[n];
        const t = o > m*1.05 ? hi : o < m*0.95 ? lo : null;
        if(t){
          t.n++;
          if(e.winner === DRAW) t.ret += 1;
          else if(e.winner === n){ t.ret += o; t.w++; }
        }
      }
      arr.push(e.odds[n]); hist.set(kk, arr);
    }
  }

  const takeouts = S.log.map(e => e.names.reduce((a,n)=>a+1/e.odds[n],0));
  const meanTake = takeouts.length ? takeouts.reduce((a,b)=>a+b,0)/takeouts.length : 0;
  const dr = globalDrawRate();
  const ceiling = takeouts.length ? dr + (1-dr)/meanTake : 0;

  const fmt = t => t.n ? `${(t.ret/t.n*100).toFixed(0)}%` : "—";

  $("checkBody").innerHTML = `
    <div class="eyebrow">土台</div>
    <div class="stat"><span>Σ(1/倍率) の平均</span><b class="num">${meanTake ? meanTake.toFixed(3) : "—"}</b></div>
    <div class="stat"><span>引き分け率</span><b class="num">${(dr*100).toFixed(1)}%</b></div>
    <div class="stat"><span>倍率どおりに賭けたときの天井</span><b class="num ${ceiling>=1?"good":"bad"}">${ceiling ? (ceiling*100).toFixed(1)+"%" : "—"}</b></div>
    <div class="note">この天井を超えるには、倍率が示す確率より正確に当てる必要があります。天井そのものは、どんな賭け方をしても変わりません。</div>

    <div class="eyebrow">この賭け方は成立するか</div>
    <div class="stat"><span>平均より高い倍率で買った場合</span><b class="num ${hi.n>=30 ? (hi.ret/hi.n>=1?"good":"bad") : ""}">${fmt(hi)} <span style="color:var(--muted);font-size:11px">(${hi.n}口)</span></b></div>
    <div class="stat"><span>平均より安い倍率で買った場合</span><b class="num">${fmt(lo)} <span style="color:var(--muted);font-size:11px">(${lo.n}口)</span></b></div>
    <div class="note">
      ${hi.n < 30
        ? `判定にはそれぞれ30口ほしいところ。あと ${Math.max(0,30-hi.n)} 口。`
        : hi.ret/hi.n > lo.ret/lo.n
          ? "高い側のほうが回収率が良い。倍率のブレは結果を予測していない＝割高だけ拾う戦略が成立します。"
          : "高い側が良くない。倍率のブレは実力差を反映している可能性があり、この戦略は使えません。"}
      これがPhase 1の合否判定です。
    </div>

    <div class="eyebrow">倍率帯ごとの回収率</div>
    <table><thead><tr><th>倍率</th><th>口数</th><th>的中</th><th>回収率</th></tr></thead><tbody>
    ${BANDS.map((b,i) => band[i].n ? `<tr>
      <td class="num">${b[0]}–${b[1]===Infinity?"":b[1]}</td>
      <td class="num">${band[i].n}</td><td class="num">${band[i].w}</td>
      <td class="num ${band[i].ret/band[i].n>=1?"good":""}">${(band[i].ret/band[i].n*100).toFixed(0)}%</td></tr>` : "").join("")}
    </tbody></table>
    <div class="note">全部が90%前後に揃っていれば、倍率は正しく値付けされています。どこかが大きく外れていれば、そこが穴です。</div>

    <div class="eyebrow">パターンの育ち具合</div>
    <div class="stat"><span>記録したパターン</span><b class="num">${P.size}</b></div>
    <div class="stat"><span>平均倍率が使える（${ODDS_MIN}戦以上）</span><b class="num">${ready}</b></div>
    <div class="stat"><span>勝率が語れる（20戦以上）</span><b class="num ${solid?"good":""}">${solid}</b></div>
    <div class="note">
      1パターン2戦では、3体から最良EVを選ぶだけで見かけのEVが1.3〜1.4に膨らみます（勝者の呪い）。
      このアプリが低サンプルで賭け金を出さないのは、その幻を避けるためです。
    </div>`;
}

function renderPhase(){
  const P = patternsIndex();
  const ready = [...P.values()].filter(v => v.length >= ODDS_MIN).length;
  $("phase").textContent = `${S.log.length}戦 / 基準確立 ${ready}パターン`;
}

/* ---------- 取り込み ---------- */
function importJSON(txt){
  const v = JSON.parse(txt);
  const src = Array.isArray(v) ? v : (v.log || []);
  const seen = new Set(S.log.map(e => `${e.ts||0}|${KEY_OF(e.names)}|${e.winner}`));
  let add = 0;
  for(const e of src){
    if(!e.names || !e.winner || !e.odds) continue;
    if(!e.names.every(n => typeof e.odds[n] === "number" && e.odds[n] > 0)) continue;
    const sig = `${e.ts||0}|${KEY_OF(e.names)}|${e.winner}`;
    if(seen.has(sig)) continue;
    seen.add(sig);
    S.log.push({ names:[...e.names], odds:{...e.odds}, winner:e.winner, bet:e.bet||null, ts:e.ts||0 });
    add++;
  }
  S.log.sort((a,b) => (a.ts||0) - (b.ts||0));
  if(typeof v.bank === "number" && v.bank > 0) S.bank = v.bank;
  save();
  return add;
}

/* ---------- 配線 ---------- */
let tt;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1800); }

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x===b));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("v-"+b.dataset.v).classList.add("on");
  if(b.dataset.v === "log") renderLog();
  if(b.dataset.v === "check") renderCheck();
  window.scrollTo({top:0});
});

$("addRow").onclick = () => addRow();
$("clearRow").onclick = () => { $("entrants").innerHTML=""; addRow(); addRow(); addRow(); $("result").innerHTML=""; pending=null; };
$("judge").onclick = () => { $("names").innerHTML = allNames().map(n=>`<option value="${n}">`).join(""); renderResult(); };
$("bank").oninput = e => { const v = parseInt(e.target.value); S.bank = (v>0?v:1000); save(); };
$("thresh").oninput = e => { const v = parseFloat(e.target.value); S.thresh = (v>0?v:1.15); save(); };
$("kfrac").oninput = e => { const v = parseFloat(e.target.value); S.kfrac = (v>0&&v<=1?v:0.25); save(); };
$("exp").onclick = () => { $("io").value = JSON.stringify(S); $("io").select(); toast("書き出しました"); };
$("imp").onclick = () => {
  try{ const n = importJSON($("io").value); toast(`${n}戦を取り込みました`); renderPhase(); renderRecent(); renderLog(); }
  catch(e){ toast("読めませんでした"); }
};
$("wipe").onclick = () => { if(confirm("記録を全部消します。元に戻せません。")){ S.log=[]; save(); renderPhase(); renderRecent(); renderLog(); toast("消しました"); } };

(async function init(){
  const saved = await Vault.load();
  if(saved) S = Object.assign(S, saved);
  $("bank").value = S.bank; $("thresh").value = S.thresh; $("kfrac").value = S.kfrac;
  addRow(); addRow(); addRow();
  $("names").innerHTML = allNames().map(n=>`<option value="${n}">`).join("");
  renderPhase(); renderRecent();
})();
</script>
