<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>闘技場 パターン攻略ノート</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#020617; color:#f1f5f9; font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; padding:16px 12px 40px; }
  .wrap { max-width:480px; margin:0 auto; }
  header { border:1px solid rgba(245,158,11,.4); border-radius:12px; background:linear-gradient(#0f172a,#020617); padding:14px 16px; margin-bottom:16px; }
  .eyebrow { color:#fbbf24; font-size:10px; letter-spacing:.2em; font-family:monospace; }
  h1 { font-size:19px; margin-top:4px; }
  .sub { color:#94a3b8; font-size:11px; margin-top:4px; }
  .toast { border:1px solid rgba(16,185,129,.4); background:rgba(16,185,129,.1); color:#6ee7b7; border-radius:8px; padding:9px 14px; font-size:13px; margin-bottom:14px; display:none; }
  .searchbox { position:relative; margin-bottom:14px; }
  input[type=text] { width:100%; background:#0f172a; border:1px solid #334155; border-radius:8px; color:#f1f5f9; padding:12px 14px; font-size:14px; }
  input[type=text]:focus { outline:none; border-color:#fbbf24; }
  .sugg { position:absolute; z-index:10; top:100%; left:0; right:0; margin-top:4px; background:#0f172a; border:1px solid #334155; border-radius:8px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .sugg button { display:flex; justify-content:space-between; width:100%; background:none; border:none; color:#f1f5f9; padding:10px 14px; font-size:13px; text-align:left; }
  .sugg button:active { background:#1e293b; }
  .sugg .addnew { color:#7dd3fc; border-top:1px solid #334155; }
  .pattern-note { border-radius:8px; padding:8px 12px; font-size:11px; margin-bottom:12px; }
  .pattern-known { border:1px solid rgba(14,165,233,.4); background:rgba(14,165,233,.1); color:#bae6fd; }
  .pattern-new { border:1px solid #334155; background:#0f172a; color:#94a3b8; }
  .empty { border:1px dashed #334155; border-radius:12px; padding:28px 16px; text-align:center; color:#64748b; font-size:13px; line-height:1.7; }
  .card { border:1px solid #1e293b; background:#0f172a; border-radius:12px; padding:12px 16px; margin-bottom:8px; }
  .card.best-ev { border-color:#34d399; background:rgba(52,211,153,.08); }
  .card.best-rate { border-color:rgba(251,191,36,.6); background:rgba(251,191,36,.05); }
  .card-head { display:flex; justify-content:space-between; align-items:center; }
  .badges { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
  .badge { font-size:9px; font-weight:bold; border-radius:4px; padding:2px 5px; }
  .b-ev { background:#34d399; color:#020617; }
  .b-rate { background:#fbbf24; color:#020617; }
  .b-new { background:#38bdf8; color:#020617; }
  .mname { font-weight:600; font-size:14px; }
  .xbtn { background:none; border:none; color:#64748b; font-size:12px; padding:4px 8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; align-items:end; }
  .lbl { font-size:9px; color:#64748b; margin-bottom:2px; }
  .big { font-family:monospace; font-weight:bold; font-size:18px; }
  .big small { font-size:11px; }
  .odds-in { width:100%; background:#1e293b; border:1px solid #475569; border-radius:6px; color:#f1f5f9; padding:5px 8px; font-size:13px; font-family:monospace; }
  .odds-in:focus { outline:none; border-color:#34d399; }
  .meta { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:8px; font-size:10.5px; color:#94a3b8; font-family:monospace; }
  .meta .pat { color:#7dd3fc; }
  .tags { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .tag { font-size:9px; border-radius:4px; padding:2px 6px; }
  .t-flag { color:#fda4af; border:1px solid rgba(251,113,133,.4); }
  .t-none { color:#7dd3fc; border:1px solid rgba(56,189,248,.4); }
  .t-few { color:#94a3b8; border:1px solid #475569; }
  .verdict { text-align:center; font-size:11.5px; color:#94a3b8; padding:6px 0 2px; line-height:1.6; }
  .verdict .ev { color:#6ee7b7; font-weight:600; }
  .verdict .rt { color:#fcd34d; font-weight:600; }
  .btn { display:block; width:100%; border-radius:8px; border:none; padding:12px; font-size:14px; font-weight:bold; margin-top:8px; }
  .btn-start { background:#fbbf24; color:#020617; }
  .btn-outline { background:none; border:1px solid #334155; color:#cbd5e1; font-weight:normal; font-size:13px; padding:10px; }
  .btn-danger { background:none; border:1px solid rgba(244,63,94,.3); color:#fb7185; font-weight:normal; font-size:11px; padding:8px; }
  .battle { border:1px solid rgba(245,158,11,.4); background:#0f172a; border-radius:12px; padding:18px 16px; }
  .battle p { text-align:center; font-size:13px; color:#cbd5e1; margin-bottom:14px; line-height:1.6; }
  .battle p small { color:#64748b; font-size:11px; }
  .btn-win { background:#1e293b; border:1px solid #475569; color:#f1f5f9; font-weight:600; font-size:13px; }
  .btn-win:active { border-color:#34d399; background:rgba(52,211,153,.15); }
  .btn-draw { background:none; border:1px solid #334155; color:#94a3b8; font-weight:normal; font-size:13px; padding:10px; }
  .btn-back { background:none; border:none; color:#64748b; font-size:11px; padding:8px; }
  ol.rank { list-style:none; border:1px solid #1e293b; border-radius:12px; overflow:hidden; margin-top:10px; }
  ol.rank li { display:flex; justify-content:space-between; align-items:center; background:#0f172a; border-bottom:1px solid #1e293b; padding:8px 12px; font-size:13px; }
  ol.rank li:last-child { border-bottom:none; }
  .rank-l { display:flex; align-items:center; gap:8px; min-width:0; }
  .rank-i { color:#64748b; font-family:monospace; font-size:11px; width:22px; text-align:right; flex-shrink:0; }
  .rank-n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-r { font-family:monospace; font-size:13px; flex-shrink:0; margin-left:8px; }
  .rank-g { color:#64748b; font-size:9px; font-family:monospace; margin-left:4px; }
  .r-hi { color:#10b981; } .r-mid { color:#f59e0b; } .r-lo { color:#f43f5e; } .r-none { color:#64748b; }
  .foot { margin-top:18px; font-size:10.5px; color:#64748b; line-height:1.7; }
  details { margin-top:16px; }
  summary { font-size:12px; color:#94a3b8; padding:8px 0; }
  textarea { width:100%; height:100px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:#cbd5e1; font-size:10px; font-family:monospace; padding:8px; margin-top:8px; }
  .io-btns { display:flex; gap:8px; margin-top:8px; }
  .io-btns .btn { margin-top:0; }
  .new-tag { color:#7dd3fc; font-size:9px; margin-left:5px; }
  .warn { color:#fb7185; font-size:11px; margin-left:5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">MONSTER ARENA — PATTERN BOOK</div>
    <h1>闘技場 パターン攻略ノート</h1>
    <div class="sub" id="headSub"></div>
  </header>

  <div class="toast" id="toast"></div>

  <div id="setupView">
    <div class="searchbox">
      <input type="text" id="search" placeholder="出場モンスターを追加(ひらがなでもOK)" autocomplete="off">
      <div class="sugg" id="sugg" style="display:none"></div>
    </div>
    <div id="patternNote"></div>
    <div id="entrantsArea"></div>
  </div>

  <div id="battleView" style="display:none">
    <div class="battle">
      <p>試合終了後、勝者をタップして記録<br><small>(記録すると出場欄は自動でリセットされます)</small></p>
      <div id="battleBtns"></div>
    </div>
  </div>

  <button class="btn btn-outline" id="rankToggle">全モンスターの勝率ランキングを見る</button>
  <div id="rankArea" style="display:none"></div>

  <button class="btn btn-danger" id="clearBtn" style="display:none"></button>

  <details>
    <summary>データのバックアップ(エクスポート / インポート)</summary>
    <textarea id="ioArea" placeholder="エクスポートを押すとここにJSONが出ます。バックアップから戻すときはここに貼り付けてインポート。"></textarea>
    <div class="io-btns">
      <button class="btn btn-outline" id="expBtn">エクスポート</button>
      <button class="btn btn-outline" id="impBtn">インポート</button>
    </div>
  </details>

  <p class="foot">新モンスターは勝率 none から始まり、記録した実測値だけで判定。既存モンスターは全体勝率を8試合分の事前情報として、この組み合わせでの実績で更新するベイズ縮小推定。期待値 = 推定勝率 × 配当倍率で、1.00倍超えなら理論上プラス。データはこの端末のブラウザ内に自動保存されます。</p>
</div>

<script>
// 初期データ: [名前, 試合数, 勝利, 敗北, 引き分け, 逃げ爆発]
const BASE = [
["アイスクラブ",70,13,50,7,false],["アイスシープ",71,16,55,0,false],["あおばなちょう",37,8,24,5,false],
["あかばなちょう",23,5,12,6,false],["いかたいしょう",23,11,11,1,false],["イビルスパイス",32,5,26,1,true],
["ウィンドデビル",17,15,1,1,false],["ウィンドビー",53,12,39,2,false],["ウッキー",13,2,11,0,false],
["おおくちばし",13,4,9,0,false],["おおナマコ",14,2,10,2,false],["おばけオトシゴ",14,1,12,1,false],
["おばけとうがらし",27,16,10,1,false],["がいこつゆうれい",18,6,12,0,true],["かいぞくウッキー",27,7,20,0,false],
["かいぞくキャット",13,2,11,0,false],["カビまんじゅう",13,10,3,0,false],["かみなりちょう",40,5,34,1,false],
["がんせきまじん",31,10,18,3,false],["ギガントード",58,11,45,2,false],["キャットシーフ",35,2,33,0,true],
["きゅうけつキャット",8,5,2,1,false],["キラービースト",33,9,24,0,false],["クイーン",17,1,9,7,false],
["けんし",13,0,13,0,true],["こうてつまじん",19,3,16,0,false],["ゴルゴンシャーク",21,7,14,0,true],
["サラマンダー",27,14,8,5,false],["さるゾンビ",39,15,24,0,true],["シールドナイト",44,6,37,1,false],
["ジェリーマウス",9,2,7,0,false],["しびれマタンゴ",33,10,15,8,false],["ジュエルロース",9,1,7,1,true],
["ダークドラゴン",26,11,13,2,false],["ダイころがし",68,29,37,2,false],["だんごボーイ",27,5,13,9,false],
["デスイーグル",19,16,3,0,true],["トーチゴースト",46,28,17,1,false],["トードロック",23,13,10,0,false],
["どくろマイマイ",31,4,25,2,false],["トゲトゲボーイ",32,13,19,0,false],["ドライウッド",49,16,26,7,false],
["ネズぶたウサギ",13,7,6,0,false],["バーサーカー",11,2,9,0,false],["バーサクタケノコ",13,9,4,0,true],
["ばけギツネ",31,6,24,1,false],["はさみサボテン",17,0,17,0,false],["はなざかりもぐら",18,0,18,0,true],
["はなもぐら",12,1,11,0,false],["パラライズレイ",54,24,25,5,false],["ハンマーアンコウ",15,2,13,0,false],
["ビースト",15,4,11,0,false],["ビショップ",32,2,24,6,false],["ひつかいキツネ",16,5,11,0,false],
["ファイアウッキー",15,5,10,0,true],["ぶたばなウサギ",11,1,10,0,false],["プチトマトおばけ",13,0,13,0,true],
["プラチナドラゴン",31,14,17,0,false],["ブラックバード",18,12,6,0,false],["ブラッドバット",21,18,3,0,false],
["ブルージャイアント",17,1,16,0,false],["ブルホーン",35,11,24,0,true],["フローズンパイン",13,0,13,0,true],
["フローズンミスト",15,7,7,1,false],["ヘビーワーム",15,11,4,0,false],["ポイズンさそり",38,6,32,0,true],
["ボムパイン",15,4,8,3,true],["マジックエイプ",29,1,28,0,false],["モフきんピカもぐら",14,3,11,0,true],
["モフネズミもぐら",14,3,11,0,true],["モフはなざかりもぐら",14,3,11,0,true],["モフはなもぐら",14,5,9,0,true],
["もろこしおばけ",30,15,15,0,false],["よつめシャーク",18,0,18,0,false],["ラッシュポウ",44,0,44,0,false],
["リーフホッグ",20,0,20,0,false],["ルーク",28,21,7,0,false],["ロックゲーター",11,3,8,0,false],
["ロックシープ",27,5,19,3,false]
];
const KEY = "arena-data";
const PRIOR_K = 8;

let store = { extra:{}, matchups:{}, custom:[] };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const v = JSON.parse(raw); store = { extra:v.extra||{}, matchups:v.matchups||{}, custom:v.custom||[] }; }
} catch(e) {}

let entrants = []; // [{name, odds}]

const $ = id => document.getElementById(id);
const toHira = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60));
const matchKey = names => [...names].sort().join("|");
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){ alert("保存に失敗しました: "+e); } };

function getStats() {
  const base = BASE.map(([name,games,w,l,d,flag]) => {
    const ex = store.extra[name] || {games:0,w:0,l:0,d:0};
    const G = games+ex.games, W = w+ex.w;
    return { name, games:G, w:W, l:l+ex.l, d:d+ex.d, rate: G>0 ? W/G*100 : null, flag, added:ex.games, isNew:false };
  });
  const custom = store.custom.map(name => {
    const ex = store.extra[name] || {games:0,w:0,l:0,d:0};
    return { name, games:ex.games, w:ex.w, l:ex.l, d:ex.d, rate: ex.games>0 ? ex.w/ex.games*100 : null, flag:false, added:ex.games, isNew:true };
  });
  return [...base, ...custom];
}
const findStat = name => getStats().find(m => m.name === name);
const rateCls = r => r===null ? "r-none" : r>=60 ? "r-hi" : r>=40 ? "r-mid" : "r-lo";
const fmtRate = r => r===null ? "none" : r.toFixed(1)+"%";

function analyze() {
  const names = entrants.map(e=>e.name);
  const mu = names.length>=2 ? (store.matchups[matchKey(names)]||null) : null;
  const rows = entrants.map(e => {
    const m = findStat(e.name);
    const pg = mu ? mu.games : 0;
    const pw = mu ? (mu.wins[e.name]||0) : 0;
    let blended = null;
    if (m.rate !== null) blended = ((m.rate/100)*PRIOR_K + pw)/(PRIOR_K+pg)*100;
    else if (pg > 0) blended = pw/pg*100;
    const odds = parseFloat(e.odds);
    const hasOdds = !isNaN(odds) && odds>0;
    return { ...m, patternGames:pg, patternWins:pw, blended, odds:hasOdds?odds:null, ev: hasOdds&&blended!==null ? blended/100*odds : null };
  });
  let bestRate=null, bestEv=null;
  if (rows.length>=2) {
    const wr = rows.filter(r=>r.blended!==null);
    if (wr.length) bestRate = wr.reduce((a,b)=>b.blended>a.blended?b:a);
    const we = rows.filter(r=>r.ev!==null);
    if (we.length>=2) bestEv = we.reduce((a,b)=>b.ev>a.ev?b:a);
  }
  return { rows, bestRate, bestEv, mu };
}

function toast(msg) {
  const t = $("toast");
  t.textContent = "✓ " + msg;
  t.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.style.display="none"; }, 4000);
}

function renderHead() {
  const totalAdded = Object.values(store.extra).reduce((s,e)=>s+e.games,0);
  const mc = Object.keys(store.matchups).length;
  $("headSub").textContent = `初期2002試合 + 追加${totalAdded}件 / パターン${mc}種 / 新モンスター${store.custom.length}体`;
  const cb = $("clearBtn");
  if (totalAdded>0 || mc>0) {
    cb.style.display = "block";
    cb.textContent = `戦績データをリセット(記録${totalAdded}件・パターン${mc}種を削除)`;
  } else cb.style.display = "none";
}

function renderSuggestions() {
  const q = $("search").value.trim();
  const box = $("sugg");
  if (!q) { box.style.display="none"; box.innerHTML=""; return; }
  const qh = toHira(q);
  const names = entrants.map(e=>e.name);
  const stats = getStats();
  const hits = stats.filter(m => toHira(m.name).includes(qh) && !names.includes(m.name)).slice(0,8);
  const exact = stats.some(m => m.name === q);
  let html = hits.map(m =>
    `<button data-add="${esc(m.name)}"><span>${esc(m.name)}${m.isNew?'<span class="new-tag">NEW</span>':''}</span><span class="${rateCls(m.rate)}" style="font-family:monospace;font-size:11px">${fmtRate(m.rate)}</span></button>`
  ).join("");
  if (!exact) html += `<button class="addnew" data-new="${esc(q)}">＋「${esc(q)}」を新モンスターとして登録</button>`;
  box.innerHTML = html;
  box.style.display = html ? "block" : "none";
}

function renderEntrants() {
  const area = $("entrantsArea");
  const { rows, bestRate, bestEv, mu } = analyze();
  const pn = $("patternNote");
  if (entrants.length >= 2) {
    pn.innerHTML = mu
      ? `<div class="pattern-note pattern-known">📖 この組み合わせは記録済み: ${mu.games}戦${mu.draws>0?`(引き分け${mu.draws})`:""} — パターン補正が効いています</div>`
      : `<div class="pattern-note pattern-new">🆕 この組み合わせは初記録。まずは全体勝率で判定します</div>`;
  } else pn.innerHTML = "";

  if (!rows.length) {
    area.innerHTML = `<div class="empty">出場モンスターを追加してね。<br>リストにいない新モンスターは、<br>名前を入力すると「＋登録」ボタンが出ます</div>`;
    return;
  }
  let html = rows.map(m => {
    const isEv = bestEv && m.name===bestEv.name;
    const isRt = bestRate && m.name===bestRate.name;
    const e = entrants.find(x=>x.name===m.name);
    return `<div class="card ${isEv?"best-ev":isRt?"best-rate":""}">
      <div class="card-head">
        <div class="badges">
          ${isEv?'<span class="badge b-ev">期待値ベスト</span>':""}
          ${isRt?'<span class="badge b-rate">勝率ベスト</span>':""}
          ${m.isNew?'<span class="badge b-new">NEW</span>':""}
          <span class="mname">${esc(m.name)}</span>
        </div>
        <button class="xbtn" data-rm="${esc(m.name)}">✕</button>
      </div>
      <div class="grid3">
        <div><div class="lbl">推定勝率${m.patternGames>0?"(補正)":"(全体)"}</div>
          <div class="big ${rateCls(m.blended)}">${m.blended===null?"none":m.blended.toFixed(1)+'<small>%</small>'}</div></div>
        <div><div class="lbl">配当倍率</div>
          <input class="odds-in" inputmode="decimal" data-odds="${esc(m.name)}" value="${esc(e.odds)}" placeholder="例: 2.5"></div>
        <div><div class="lbl">期待値</div>
          <div class="big ${m.ev===null?"r-none":m.ev>=1?"r-hi":m.ev>=0.8?"r-mid":"r-lo"}" data-evcell="${esc(m.name)}">${m.ev===null?"--":m.ev.toFixed(2)+'<small>倍</small>'}</div></div>
      </div>
      <div class="meta">
        <span>全体 ${fmtRate(m.rate)}(${m.w}勝/${m.games}戦${!m.isNew&&m.added>0?`<span class="r-hi">+${m.added}</span>`:""})</span>
        ${m.patternGames>0?`<span class="pat">この組合せ ${m.patternWins}勝/${m.patternGames}戦</span>`:""}
      </div>
      <div class="tags">
        ${m.flag?'<span class="tag t-flag">⚠ 逃げ・爆発あり</span>':""}
        ${m.blended===null?'<span class="tag t-none">データなし — 記録して育てよう</span>':""}
        ${m.blended!==null&&m.games<15?'<span class="tag t-few">試合数少なめ</span>':""}
      </div>
    </div>`;
  }).join("");

  if (bestRate && rows.length>=2) {
    html += `<div class="verdict">${
      bestEv
        ? `期待値なら <span class="ev">${esc(bestEv.name)}</span>(${bestEv.ev.toFixed(2)}倍)` +
          (bestEv.name!==bestRate.name ? `、堅実なら <span class="rt">${esc(bestRate.name)}</span>` : "")
        : `現時点のおすすめ: <span class="rt">${esc(bestRate.name)}</span>(推定 ${bestRate.blended.toFixed(1)}%)`
    }</div>`;
  }
  if (entrants.length>=2) html += `<button class="btn btn-start" id="startBtn">スタート(試合開始)</button>`;
  area.innerHTML = html;
}

function renderBattle() {
  $("battleBtns").innerHTML =
    entrants.map(e=>`<button class="btn btn-win" data-win="${esc(e.name)}">🏆 ${esc(e.name)}</button>`).join("") +
    `<button class="btn btn-draw" data-win="__draw__">引き分け</button>
     <button class="btn btn-back" id="backBtn">← 戻る(記録しない)</button>`;
}

function renderRanking() {
  const area = $("rankArea");
  if (area.style.display==="none") return;
  const sorted = getStats().sort((a,b)=>{
    if (a.rate===null&&b.rate===null) return 0;
    if (a.rate===null) return 1;
    if (b.rate===null) return -1;
    return b.rate-a.rate;
  });
  area.innerHTML = `<ol class="rank">` + sorted.map((m,i)=>
    `<li><div class="rank-l"><span class="rank-i">${i+1}</span><span class="rank-n">${esc(m.name)}</span>${m.isNew?'<span class="new-tag">NEW</span>':""}${m.flag?'<span class="warn">⚠</span>':""}</div>
     <div><span class="rank-r ${rateCls(m.rate)}">${fmtRate(m.rate)}</span><span class="rank-g">(${m.games})</span></div></li>`
  ).join("") + `</ol>`;
}

function renderAll() { renderHead(); renderEntrants(); renderRanking(); }

function recordResult(winner) {
  const names = entrants.map(e=>e.name);
  const key = matchKey(names);
  for (const n of names) {
    const cur = store.extra[n] || {games:0,w:0,l:0,d:0};
    const upd = {...cur, games:cur.games+1};
    if (winner==="__draw__") upd.d+=1;
    else if (n===winner) upd.w+=1;
    else upd.l+=1;
    store.extra[n] = upd;
  }
  const rec = store.matchups[key] || {names, games:0, draws:0, wins:{}};
  if (winner==="__draw__") rec.draws+=1;
  else rec.wins[winner] = (rec.wins[winner]||0)+1;
  rec.games+=1;
  store.matchups[key] = rec;
  save();
  toast(winner==="__draw__" ? `引き分けを記録しました(このパターン ${rec.games}戦目)` : `${winner} の勝利を記録しました(このパターン ${rec.games}戦目)`);
  entrants = [];
  $("battleView").style.display="none";
  $("setupView").style.display="block";
  renderAll();
}

// --- イベント ---
$("search").addEventListener("input", renderSuggestions);
$("sugg").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.add) {
    entrants.push({name:b.dataset.add, odds:""});
  } else if (b.dataset.new) {
    const name = b.dataset.new;
    if (!getStats().some(m=>m.name===name)) { store.custom.push(name); save(); toast(`新モンスター「${name}」を登録しました(勝率は none からスタート)`); }
    entrants.push({name, odds:""});
  }
  $("search").value=""; $("sugg").style.display="none";
  renderAll();
});
$("entrantsArea").addEventListener("click", e => {
  const rm = e.target.closest("[data-rm]");
  if (rm) { entrants = entrants.filter(x=>x.name!==rm.dataset.rm); renderAll(); return; }
  if (e.target.id==="startBtn" || e.target.closest("#startBtn")) {
    $("setupView").style.display="none";
    $("battleView").style.display="block";
    renderBattle();
  }
});
$("entrantsArea").addEventListener("input", e => {
  const inp = e.target.closest("[data-odds]");
  if (!inp) return;
  const ent = entrants.find(x=>x.name===inp.dataset.odds);
  if (ent) ent.odds = inp.value;
  // フォーカスを保つため全再描画はせず、期待値セルと判定だけ更新
  const { rows, bestRate, bestEv } = analyze();
  for (const m of rows) {
    const cell = document.querySelector(`[data-evcell="${CSS.escape(m.name)}"]`);
    if (cell) {
      cell.innerHTML = m.ev===null ? "--" : m.ev.toFixed(2)+"<small>倍</small>";
      cell.className = "big " + (m.ev===null?"r-none":m.ev>=1?"r-hi":m.ev>=0.8?"r-mid":"r-lo");
    }
  }
});
$("battleView").addEventListener("click", e => {
  const w = e.target.closest("[data-win]");
  if (w) { recordResult(w.dataset.win); return; }
  if (e.target.id==="backBtn") {
    $("battleView").style.display="none";
    $("setupView").style.display="block";
  }
});
$("rankToggle").addEventListener("click", () => {
  const a = $("rankArea");
  const open = a.style.display==="none";
  a.style.display = open ? "block" : "none";
  $("rankToggle").textContent = open ? "ランキングを閉じる" : "全モンスターの勝率ランキングを見る";
  renderRanking();
});
$("clearBtn").addEventListener("click", () => {
  if (!confirm("蓄積した戦績データ(パターン記録含む)をすべて削除しますか?初期の2002試合分と新モンスターの名前は残ります。")) return;
  store.extra = {}; store.matchups = {};
  save(); toast("戦績データをリセットしました"); renderAll();
});
$("expBtn").addEventListener("click", () => {
  $("ioArea").value = JSON.stringify(store);
  $("ioArea").select();
  toast("エクスポートしました。全選択されているのでコピーしてメモ等に保存してね");
});
$("impBtn").addEventListener("click", () => {
  try {
    const v = JSON.parse($("ioArea").value);
    store = { extra:v.extra||{}, matchups:v.matchups||{}, custom:v.custom||[] };
    save(); toast("インポートしました"); renderAll();
  } catch(e) { alert("JSONの読み込みに失敗しました。エクスポートした文字列をそのまま貼り付けてね。"); }
});

renderAll();
</script>
</body>
</html>
